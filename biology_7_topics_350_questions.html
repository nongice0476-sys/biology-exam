<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biology 7 Topics — 350 Question Mock Exam</title>
<style>
:root{--bg:#07111f;--panel:#0f1c2e;--card:#14243a;--line:#29405e;--text:#eff6ff;--muted:#9db0c9;--accent:#8bb0ff;--good:#3ddc84;--bad:#ff6f7d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,"Noto Sans Thai",sans-serif}
header{position:sticky;top:0;z-index:20;background:#07111fed;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px}
.toolbar{max-width:1250px;margin:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0 auto 0 0}
select,button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
button{cursor:pointer}button:hover{border-color:var(--accent)}
main{max-width:1000px;margin:20px auto;padding:0 14px 80px}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.pill{padding:7px 10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;margin:13px 0}
.qmeta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px;margin-bottom:10px}
.prompt{font-size:16px;line-height:1.65;font-weight:600}
.options{display:grid;gap:8px;margin-top:13px}
.option{display:block;background:#0c192a;border:1px solid transparent;padding:11px;border-radius:10px;cursor:pointer;line-height:1.5}
.option:hover{border-color:var(--line)}
.explain{margin-top:12px;padding:12px;background:#0b1828;border-left:3px solid var(--accent);border-radius:9px;line-height:1.6}
.card.correct{outline:2px solid var(--good)}.card.wrong{outline:2px solid var(--bad)}
.score{font-weight:800}.muted{color:var(--muted)}.hidden{display:none}
footer{color:var(--muted);font-size:13px;margin-top:30px;line-height:1.6}
@media(max-width:760px){h1{width:100%}.toolbar>*{flex:1 1 auto}}
</style>
</head>
<body>
<header><div class="toolbar">
<h1>Biology University Mock Exam — 350 Questions</h1>
<select id="topic"></select>
<select id="difficulty">
<option value="ทั้งหมด">ทุกระดับ</option><option value="ง่าย">ง่าย</option><option value="กลาง">กลาง</option><option value="ยาก">ยาก</option>
</select>
<select id="count">
<option value="50">50 ข้อ</option><option value="20">20 ข้อสุ่ม</option><option value="10">10 ข้อสุ่ม</option>
</select>
<button id="newExam">สร้างชุดใหม่</button>
<button id="grade">ตรวจคะแนน</button>
<button id="reveal">เฉลยทั้งหมด</button>
<span id="score" class="score"></span>
</div></header>
<main>
<div class="summary" id="summary"></div>
<div id="app"></div>
<footer>
โหมดตรวจคะแนนจะแสดงเฉลยและเหตุผลหลังตรวจ • ปุ่ม “สร้างชุดใหม่” จะสุ่มลำดับข้อและตัวเลือกตามหัวข้อ/ระดับที่เลือก
</footer>
</main>

const letters=["ก","ข","ค","ง"];
const $=s=>document.querySelector(s);
let exam=[], answers={}, revealed=false;

function makeExam(){
  const topic=$("#topic").value;
  const diff=$("#difficulty").value;
  const count=Number($("#count").value);
  let pool=DATA[topic].filter(q=>diff==="ทั้งหมด"||q.difficulty===diff);
  pool=[...pool].sort(()=>Math.random()-.5);
  exam=pool.slice(0,Math.min(count,pool.length)).map(q=>({...q}));
  answers={};revealed=false;$("#score").textContent="";
  render();
}

function render(){
  const topic=$("#topic").value;
  $("#summary").innerHTML=`<span class="pill">${topic}</span><span class="pill">${exam.length} ข้อ</span><span class="pill">ระดับ: ${$("#difficulty").value}</span>`;
  $("#app").innerHTML=exam.map((q,i)=>`
    <section class="card" id="card-${q.id}">
      <div class="qmeta"><b>ข้อ ${i+1}</b><span>ระดับ${q.difficulty}</span></div>
      <div class="prompt">${q.prompt}</div>
      <div class="options">${q.options.map((o,j)=>`<label class="option"><input type="radio" name="${q.id}" value="${j}" ${answers[q.id]===j?"checked":""}> <b>${letters[j]}.</b> ${o}</label>`).join("")}</div>
      <div class="explain ${revealed?"":"hidden"}"><b>เฉลย:</b> ${letters[q.answer]}. ${q.options[q.answer]}<br><b>เหตุผล:</b> ${q.explanation}</div>
    </section>`).join("");
  document.querySelectorAll('input[type=radio]').forEach(x=>x.onchange=()=>answers[x.name]=Number(x.value));
}

function grade(){
  let score=0;
  exam.forEach(q=>{
    const card=$("#card-"+CSS.escape(q.id));
    card.classList.remove("correct","wrong");
    if(answers[q.id]===q.answer){score++;card.classList.add("correct")} else card.classList.add("wrong");
    card.querySelector(".explain").classList.remove("hidden");
  });
  revealed=true;
  $("#score").textContent=`คะแนน ${score} / ${exam.length} (${exam.length?Math.round(score/exam.length*100):0}%)`;
}

function reveal(){
  revealed=true;
  document.querySelectorAll(".explain").forEach(x=>x.classList.remove("hidden"));
}

document.addEventListener("DOMContentLoaded",()=>{
  Object.keys(DATA).forEach(k=>$("#topic").innerHTML+=`<option value="${k}">${k}</option>`);
  $("#topic").onchange=makeExam;$("#difficulty").onchange=makeExam;$("#count").onchange=makeExam;
  $("#newExam").onclick=makeExam;$("#grade").onclick=grade;$("#reveal").onclick=reveal;
  makeExam();
});
</script>
